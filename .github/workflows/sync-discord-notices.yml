name: Sync Discord announcements
on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chunsam-discord-notices
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-discord-notices.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1544674816530063380'
      - name: Publish notices
        run: |
          if ! git diff --quiet -- notices.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add notices.json
            git commit -m 'Sync Discord announcements'
            git pull --rebase origin main
            git push origin main
          fi

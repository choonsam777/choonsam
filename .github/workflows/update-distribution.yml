name: Update launcher distribution
on:
  push:
    paths:
      - 'mods/**'
      - 'shaderpacks.json'
      - 'server.json'
      - 'scripts/generate-distribution.mjs'
      - 'fabric/**'
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: chunsam-launcher-distribution
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-distribution.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated manifest
        run: |
          if ! git diff --quiet -- distribution.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add distribution.json
            git commit -m 'Update launcher distribution files'
            git pull --rebase origin main
            git push
          fi
